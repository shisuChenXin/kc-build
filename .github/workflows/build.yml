name: Build iOS dylib
on: [push]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -arch arm64 \
            -shared -fPIC -O2 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios15.0 \
            -o kcd.dylib kc_mod.c
          file kcd.dylib
          codesign -s - kcd.dylib
          nm -gU kcd.dylib | grep -E "entry_main|plugin_main" || true
          ls -la kcd.dylib
      - name: Commit artifact
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git checkout -b builds || git checkout builds
          cp kcd.dylib kcd-latest.dylib
          git add kcd-latest.dylib
          git commit -m "build artifact" || echo "no changes"
          git push origin builds
      - uses: actions/upload-artifact@v4
        with:
          name: kcd-dylib
          path: kcd.dylib
